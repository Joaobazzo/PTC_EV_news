name: Scrape News

on:
  schedule:
    - cron: '0 8 * * *'  # every day at 8 AM UTC
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install dependencies
        run: |
          Rscript -e 'install.packages(c("rvest", "digest"))'

      - name: Run scraping script
        run: |
          Rscript scrape_news_uber.R
          Rscript scrape_news.R

      - name: Commit changes if any
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/*
          git diff --cached --quiet || git commit -m "Update news content [CI]"
          git push
